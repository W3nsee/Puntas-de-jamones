<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acumulador de Puntas de Jamón</title>
    <!-- Librerías importadas directamente de internet -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333;
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            text-align: center;
        }
        h1 { font-size: 24px; color: #d32f2f; }
        input[type="file"] { margin: 20px 0; border: 1px dashed #ccc; padding: 10px; width: 90%; }
        button { 
            padding: 12px 24px; 
            margin: 10px; 
            cursor: pointer; 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 25px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: left; 
        }
        th { background-color: #f8f9fa; font-weight: bold; }
        #status { font-weight: bold; color: #555; margin-top: 15px; }
        .progress { color: #1976d2; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍖 Acumulador de Puntas de Jamón</h1>
        <p>Selecciona todas las fotografías de tus hojas para generar el acumulado total.</p>
        
        <input type="file" id="imageInput" accept="image/*" multiple>
        <br>
        <button id="processBtn" onclick="processImages()">Procesar Fotografías</button>
        
        <p id="status"></p>

        <table id="resultTable" style="display:none;">
            <thead>
                <tr>
                    <th>CÓDIGO</th>
                    <th>JAMÓN</th>
                    <th>PESO TOTAL</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        
        <br>
        <button id="downloadBtn" style="display:none;" onclick="downloadExcel()">📥 Descargar Excel</button>
    </div>

    <script>
        // Catálogo oficial con diccionario de alias extraídos de las notas a mano
        const catalog = [
            { codigo: 502, nombre: "LONCHI", alias: ["lonchi", "lonch", "lonchi mexicano", "lonchi pavo"] },
            { codigo: 503, nombre: "AHUMADO NAYAR", alias: ["ahumado nayar", "ahumado"] },
            { codigo: 504, nombre: "CAMPIRANO", alias: ["campirano", "campivono", "camp"] },
            { codigo: 506, nombre: "JAMON PAVO SABROSO", alias: ["sabroso", "pavo sabroso", "jamon pavo sabroso"] },
            { codigo: 507, nombre: "PIERNA NAYAR", alias: ["pierna nayar", "nayar pierna"] },
            { codigo: 508, nombre: "PIERNA AMERICANA", alias: ["pierna americana", "americana", "pierna americana mex", "pierna americ mex", "pierna amer mex", "pierna amencana mex"] },
            { codigo: 509, nombre: "PIERNA NATURAL", alias: ["pierna natural", "natural", "pierna natural mex", "pierna natu mex", "pierna nat mex"] },
            { codigo: 510, nombre: "JAMON NAYAR VIRGINIA", alias: ["nayar virginia", "virginia nayar", "pavo nayar", "nayar pavo"] },
            { codigo: 512, nombre: "VIRGINIA DELICIA", alias: ["virginia delicia", "delicia"] },
            { codigo: 513, nombre: "PAVO BAFAR", alias: ["pavo bafar", "virginia bafar", "bafar pavo", "bafar virginia", "virginia", "virginia pavo", "bafar virginia pavo"] }, 
            { codigo: 514, nombre: "VIRGINIA SABORI", alias: ["virginia sabori", "sabori virginia", "sabori"] },
            { codigo: 515, nombre: "PIERNA BAFAR", alias: ["pierna bafar", "bafar pierna"] },
            { codigo: 516, nombre: "PECHUGA BAFAR", alias: ["pechuga bafar", "bafar pechuga", "pechuga"] }
        ];

        const fuse = new Fuse(catalog, { keys: ["nombre", "alias"], threshold: 0.4 });
        let finalData = [];

        async function processImages() {
            const fileInput = document.getElementById('imageInput');
            const status = document.getElementById('status');
            const btn = document.getElementById('processBtn');

            if (!fileInput.files.length) {
                alert("Por favor selecciona al menos una foto.");
                return;
            }

            btn.disabled = true;
            let globalAccumulators = {};
            const totalFiles = fileInput.files.length;

            for (let i = 0; i < totalFiles; i++) {
                status.innerHTML = `<span class="progress">⏳ Analizando foto ${i + 1} de ${totalFiles}... (esto puede tardar unos segundos)</span>`;
                
                try {
                    const file = fileInput.files[i];
                    const { data: { text } } = await Tesseract.recognize(file, 'spa');
                    globalAccumulators = analyzeText(text, globalAccumulators);
                } catch (error) {
                    console.error(`Error al procesar la foto ${i + 1}:`, error);
                    alert(`Hubo un problema leyendo la foto número ${i + 1}. El sistema continuará con las demás.`);
                }
            }

            status.innerText = "🔍 Finalizando sumas y preparando la tabla...";
            finalData = Object.values(globalAccumulators);
            displayTable();
            btn.disabled = false;
        }

        function analyzeText(text, currentAccumulators) {
            const lines = text.split('\n');
            
            lines.forEach(line => {
                // Busca letras, espacios y luego números que pueden empezar con punto (ej. .030)
                const match = line.match(/([a-zA-Z\s]+)[\s:]+([0-9]*\.?[0-9]+)/);
                if (match) {
                    const rawName = match[1].trim();
                    let weightStr = match[2];
                    
                    // Si Tesseract lee algo como ".030" sin el cero antes, lo ajustamos
                    if (weightStr.startsWith('.')) {
                        weightStr = '0' + weightStr;
                    }
                    
                    const weight = parseFloat(weightStr);

                    const searchResult = fuse.search(rawName);
                    // Aseguramos que la coincidencia sea aceptable y el peso válido
                    if (searchResult.length > 0 && !isNaN(weight)) {
                        const foundItem = searchResult[0].item;
                        const key = foundItem.codigo;
                        
                        if (!currentAccumulators[key]) {
                            currentAccumulators[key] = { codigo: foundItem.codigo, nombre: foundItem.nombre, peso: 0 };
                        }
                        currentAccumulators[key].peso += weight;
                    }
                }
            });
            
            return currentAccumulators;
        }

        function displayTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            const table = document.getElementById('resultTable');
            const downloadBtn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            if (finalData.length === 0) {
                status.innerText = "⚠️ No se detectaron productos o pesos en las imágenes. Revisa que las fotos sean nítidas.";
                table.style.display = 'none';
                downloadBtn.style.display = 'none';
                return;
            }

            finalData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.codigo}</td><td>${row.nombre}</td><td>${row.peso.toFixed(3)} KG</td>`;
                tbody.appendChild(tr);
            });

            status.innerText = "✅ ¡Acumulado total generado con éxito!";
            table.style.display = 'table';
            downloadBtn.style.display = 'inline-block';
        }

        function downloadExcel() {
            const worksheet = XLSX.utils.json_to_sheet(finalData.map(item => ({
                "CODIGO": item.codigo,
                "JAMON": item.nombre,
                "PESO TOTAL": parseFloat(item.peso.toFixed(3))
            })));
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Hoja1");
            
            XLSX.writeFile(workbook, "SALIDA PUNTAS JAMON_ACUMULADO.xlsx");
        }
    </script>
</body>
</html>
